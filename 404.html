    body {
      padding-top: 60px;
      padding-bottom: 40px;
    }

    .hero-unit {
      background-color: #5c1a7e;

      background-image: -webkit-gradient(linear, left top, right top,
          color-stop(0, #290e38),
          color-stop(0.35, #5c1a7e),
          color-stop(0.65, #8b22a2),
          color-stop(1, #3e0e56));

      background-image: -webkit-linear-gradient(left,
          #290e38 0%,
          #5c1a7e 35%,
          #8b22a2 65%,
          #3e0e56 100%);

      background-image: linear-gradient(to right,
          #290e38 0%,
          #5c1a7e 35%,
          #8b22a2 65%,
          #3e0e56 100%);

      filter: drop-shadow(0px 0px 8px #5c1a7e);
    }

    .hero-split {
      margin: 0;
      padding: 0;
      border: 0;
      text-align: left;
      max-width: 28em;
    }

    .hero-split h1 {
      margin-bottom: 12px;
      overflow: hidden;
      font-family: Slate, sans-serif;
      font-size: 32px;
      line-height: 60px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: .5625em;
    }

    .hero-split h1>span {
      display: inline-block;
      float: left;
      background: #000;
      color: #FFF;
      margin: 0 5px 5px 0;
      padding: 0 2px 0 20px;
      box-shadow: 0px 0px 4px 4px #2e2e2e33;
    }

    .hero-lead {
      filter: drop-shadow(2px 4px 6px black);
    }

    .alert {
      -webkit-animation: alertPopup 500ms cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards;
      animation: alertPopup 500ms cubic-bezier(0.68, -0.6, 0.32, 1.6) forwards;
    }

    .alert>* {
      opacity: 0;

      -webkit-transform: translateY(-6px);
      transform: translateY(-6px);

      -webkit-animation: alertContent 130ms ease-out forwards;
      animation: alertContent 130ms ease-out forwards;

      -webkit-animation-delay: 300ms;
      animation-delay: 300ms;
    }

    @-webkit-keyframes alertPopup {
      from {
        -webkit-transform: scaleY(0);
      }

      to {
        -webkit-transform: scaleY(1);
      }
    }

    @keyframes alertPopup {
      from {
        transform: scaleY(0);
      }

      to {
        transform: scaleY(1);
      }
    }

    @-webkit-keyframes alertContent {
      to {
        opacity: 1;
        -webkit-transform: translateY(0);
      }
    }

    @keyframes alertContent {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    @media (max-width: 767px) {
      .hero-split {
        max-width: 100%;
      }

      .hero-split h1 {
        font-size: 20px;
        line-height: 36px;
        letter-spacing: 0.3em;
      }

      .hero-split h1>span {
        display: inline-block;
        float: none;
        margin: 0 3px 3px 0;
        padding: 0 6px;
      }

      .hero-unit p {
        max-width: 100%;
      }
    }

    .disabled {
      cursor: not-allowed !important;
    }

    .clickable {
      cursor: pointer;
    }

    .content-embed {
      width: 100%;
      height: 650px;
    }

    .media.well {
      min-height: 100px;
      background-color: #2b2b2b;
      background-image: -moz-linear-gradient(top, #333, #222);
      background-image: -webkit-gradient(linear, 0 0, 0 100%, from(#333), to(#222));
      background-image: -webkit-linear-gradient(top, #333, #222);
      background-image: -o-linear-gradient(top, #333, #222);
      background-image: linear-gradient(to bottom, #333, #222);
      border-color: #353535;
      filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#ff333333', endColorstr='#ff222222', GradientType=0);
      transition:
        transform 0.2s ease-in-out,
        box-shadow 0.2s ease-in-out;
    }

    .media.well:hover,
    .media.well:focus-visible {
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
    }

    @media (prefers-reduced-motion: no-preference) {
      .media.well:hover,
      .media.well:focus-visible {
        transform: scale(1.025);
      }
    }

    .media-object {
      filter: drop-shadow(0px 2px 4px #24bd61);
    }

    .download-content{
      margin: 4px 35px;
    }

    <script>
      (function($){
        $(function(){
          var baseSpeed = 20;
          var variance = 50;
          var spanDelayBase = 120;
          var $hero = $('.hero-unit');
          var $herosplit = $('.hero-split h1');
        
          // stops the hero size jumping around, we should do it for stuff inside too but eh
          $hero.css('height', $hero.height());
          $herosplit.css('height', $herosplit.height());

          $('.hero-split h1>span').each(function(index){
            var $el = $(this);
            var text = $el.text();
            $el.text('');

            var totalDelay = index * spanDelayBase + Math.floor(Math.random() * 90);

            for (var i = 0; i < text.length; i++){
              (function(i){
                var charDelay = baseSpeed + Math.floor(Math.random() * variance);
                totalDelay += charDelay;
                setTimeout(function(){
                  $el.text(text.substr(0, i+1));
                }, totalDelay);
              })(i);
            }
          });
        });
      })(jQuery);
    </script>
